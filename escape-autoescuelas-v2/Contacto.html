<!DOCTYPE html>

  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"ContactPage","name":"Contacto · Escape Autoescuelas","url":"https://escapeautoescuelas.com/contacto","mainEntity":{"@type":"DrivingSchool","name":"Escape Autoescuelas","telephone":"+34601302309","address":{"@type":"PostalAddress","streetAddress":"Carrer Jaime Gómez Orts, 18","addressLocality":"Elx","postalCode":"03202","addressRegion":"Alicante","addressCountry":"ES"}}}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    const PHONE_DISPLAY = "601 30 23 09";
    const PHONE_TEL = "tel:+34601302309";
    const WHATSAPP_URL = "https://wa.me/34601302309?text=Hola%2C%20quiero%20info%20de%20Escape%20Autoescuelas";
    const MAPS_URL = "https://www.google.com/maps/search/?api=1&query=Carrer+Jaime+G%C3%B3mez+Orts+18+03202+Elx+Alicante";
    const MAPS_EMBED = "https://www.google.com/maps?q=Carrer+Jaime+G%C3%B3mez+Orts+18+03202+Elx+Alicante&output=embed";
    const FORM_ENDPOINT = "";
    const TARGET_EMAIL = "info@escapeautoescuelas.com";

    function useReveal(once = true) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el || typeof IntersectionObserver === "undefined") return;
        const io = new IntersectionObserver(
          (entries) => entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("is-visible"); if (once) io.unobserve(e.target); }
          }),
          { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
        );
        io.observe(el);
        return () => io.disconnect();
      }, [once]);
      return ref;
    }

    const navStyles = {
      nav: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 56px", background: "var(--escape-ink)", color: "#fff", position: "sticky", top: 0, zIndex: 50 },
      brand: { display: "flex", alignItems: "center", textDecoration: "none" },
      navLinks: { display: "flex", gap: 28 },
      navLink: { color: "rgba(255,255,255,0.85)", fontSize: 14, fontWeight: 500, textDecoration: "none" },
      navCta: { background: "var(--escape-red)", color: "#fff", border: 0, padding: "12px 22px", borderRadius: 999, fontWeight: 700, fontSize: 14 },
      footer: { background: "var(--escape-red)", color: "#fff", padding: "80px 56px 32px", overflow: "hidden" },
      footerHero: { fontFamily: "var(--font-display)", fontSize: 280, lineHeight: 0.85, color: "#fff" },
      footerSub: { marginTop: -16 },
      footerBot: { display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, borderTop: "1px solid rgba(255,255,255,0.2)", marginTop: 64, paddingTop: 24, fontSize: 13, color: "rgba(255,255,255,0.85)" },
    };

    function CNav() {
      return (
        <header style={navStyles.nav} data-c="nav">
          <a style={navStyles.brand} data-c="brand" href="index.html" aria-label="Inicio Escape Autoescuelas">
            <img src="assets/logo.svg" alt="Escape Autoescuelas" style={{ height: 32, filter: "brightness(0) invert(1)" }} />
          </a>
          <nav style={navStyles.navLinks} data-c="navLinks">
            <a className="escape-nav-link" style={navStyles.navLink} href="Permisos.html">Permisos</a>
            <a className="escape-nav-link" style={navStyles.navLink} href="Permisos.html">Precios</a>
            <a className="escape-nav-link" style={navStyles.navLink} href="#equipo">Equipo</a>
            <a className="escape-nav-link" style={navStyles.navLink} href="Contacto.html">Contacto</a>
          </nav>
          <a href="Contacto.html" className="escape-btn" style={{ ...navStyles.navCta, textDecoration: "none", display: "inline-block" }}>
            Matrícula <span className="escape-btn-arrow">→</span>
          </a>
        </header>
      );
    }

    function CFooter() {
      return (
        <footer style={navStyles.footer} data-c="footer">
          <div style={{ marginBottom: 40 }}>
            <img src="assets/logo.svg" alt="Escape Autoescuelas" style={{ height: 64, filter: "brightness(0) invert(1)" }} />
          </div>
          <div style={navStyles.footerBot} data-c="footer-bot">
            <span>© 2026 Escape Autoescuelas · Elx</span>
            <a href={PHONE_TEL} style={{ fontFamily: "var(--font-mono)", color: "rgba(255,255,255,0.85)", textDecoration: "none" }}>{PHONE_DISPLAY}</a>
            <span style={{ fontFamily: "var(--font-mono)" }}>escapeautoescuelas.com</span>
            <span style={{ display: "flex", gap: 12 }}>
              <a href="legal/aviso-legal.html" style={{ color: "inherit", textDecoration: "none" }}>Aviso legal</a>
              <a href="legal/politica-privacidad.html" style={{ color: "inherit", textDecoration: "none" }}>Privacidad</a>
              <a href="legal/politica-cookies.html" style={{ color: "inherit", textDecoration: "none" }}>Cookies</a>
            </span>
          </div>
        </footer>
      );
    }

    function InfoBlock({ label, children }) {
      return (
        <div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.15em", color: "var(--escape-mute)" }}>{label}</div>
          <div style={{ fontSize: 16, marginTop: 8, lineHeight: 1.5 }}>{children}</div>
        </div>
      );
    }

    function Field({ label, placeholder, type = "text", value, onChange, required, inputMode, autoComplete }) {
      return (
        <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.1em", color: "var(--escape-mute)" }}>
            {label.toUpperCase()}{required && <span style={{ color: "var(--escape-red)" }}> *</span>}
          </span>
          <input type={type} placeholder={placeholder} value={value} onChange={onChange} required={required} inputMode={inputMode} autoComplete={autoComplete} className="escape-input"
            style={{ border: "1px solid var(--escape-line)", borderRadius: 12, padding: "12px 14px", fontSize: 15, fontFamily: "inherit", outline: "none" }} />
        </label>
      );
    }

    function Select({ label, options, value, onChange }) {
      return (
        <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.1em", color: "var(--escape-mute)" }}>{label.toUpperCase()}</span>
          <select value={value} onChange={onChange} className="escape-select"
            style={{ border: "1px solid var(--escape-line)", borderRadius: 12, padding: "12px 14px", fontSize: 15, fontFamily: "inherit", background: "#fff", outline: "none" }}>
            {options.map((o) => <option key={o}>{o}</option>)}
          </select>
        </label>
      );
    }

    function ContactForm() {
      const [status, setStatus] = useState({ state: "idle", msg: "" });
      const [values, setValues] = useState({ nombre: "", telefono: "", permiso: "Coche B", cuando: "", mensaje: "", consent: false, website: "" });

      const upd = (k) => (e) => setValues((v) => ({ ...v, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value }));

      function buildBody() {
        return [
          `Nombre: ${values.nombre}`,
          `Teléfono: ${values.telefono}`,
          `Permiso de interés: ${values.permiso}`,
          `Cuándo empezar: ${values.cuando}`,
          "", "Mensaje:", values.mensaje || "(sin mensaje)",
        ].join("\n");
      }

      async function handleSubmit(e) {
        e.preventDefault();
        if (values.website) return;
        if (!values.nombre.trim() || !values.telefono.trim() || !values.consent) {
          setStatus({ state: "error", msg: "Rellena nombre, teléfono y acepta la política." });
          return;
        }
        const cleaned = values.telefono.replace(/[\s.\-()]/g, "");
        if (!/^(\+?34)?[6789]\d{8}$/.test(cleaned)) {
          setStatus({ state: "error", msg: "Revisa el teléfono — formato español (9 dígitos)." });
          return;
        }
        setStatus({ state: "sending", msg: "Enviando…" });
        try {
          if (FORM_ENDPOINT) {
            const res = await fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(values) });
            if (!res.ok) throw new Error("Form error");
            setStatus({ state: "success", msg: "¡Recibido! Te llamamos en menos de 24h." });
          } else {
            const subject = encodeURIComponent(`Web · Info ${values.permiso} · ${values.nombre}`);
            const body = encodeURIComponent(buildBody());
            window.location.href = `mailto:${TARGET_EMAIL}?subject=${subject}&body=${body}`;
            setStatus({ state: "success", msg: "Abrimos tu cliente de email para que envíes la solicitud. ¿Prefieres WhatsApp? Es más rápido." });
          }
        } catch (err) {
          setStatus({ state: "error", msg: "Algo ha fallado. Prueba por WhatsApp al " + PHONE_DISPLAY + "." });
        }
      }

      return (
        <form onSubmit={handleSubmit} noValidate
          style={{ background: "#fff", border: "1px solid var(--escape-line)", borderRadius: 28, padding: 40, display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 32, letterSpacing: "-0.02em" }}>Pide info</div>
          <p style={{ fontSize: 14, color: "var(--escape-ink-2)" }}>Te llamamos sin compromiso en menos de 24h.</p>
          <input type="text" name="website" value={values.website} onChange={upd("website")} autoComplete="off" tabIndex={-1} aria-hidden="true"
            style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }} />
          <Field label="Nombre" placeholder="Tu nombre" value={values.nombre} onChange={upd("nombre")} required />
          <Field label="Teléfono" placeholder="6XX XX XX XX" type="tel" value={values.telefono} onChange={upd("telefono")} required inputMode="tel" autoComplete="tel" />
          <Select label="Permiso que te interesa" value={values.permiso} onChange={upd("permiso")}
            options={["Coche B", "Moto A1", "Moto A2", "Moto A", "Ciclomotor AM", "No lo tengo claro"]} />
          <Field label="Cuándo te vendría bien empezar" placeholder="Esta semana, el mes que viene…" value={values.cuando} onChange={upd("cuando")} />
          <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.1em", color: "var(--escape-mute)" }}>MENSAJE (OPCIONAL)</span>
            <textarea rows={3} placeholder="Cuéntanos cualquier duda" value={values.mensaje} onChange={upd("mensaje")} className="escape-textarea"
              style={{ border: "1px solid var(--escape-line)", borderRadius: 12, padding: "12px 14px", fontSize: 15, fontFamily: "inherit", resize: "vertical", outline: "none" }} />
          </label>
          <label style={{ display: "flex", gap: 10, alignItems: "flex-start", fontSize: 13, lineHeight: 1.4, color: "var(--escape-ink-2)" }}>
            <input type="checkbox" checked={values.consent} onChange={upd("consent")} style={{ marginTop: 3, accentColor: "var(--escape-red)" }} required />
            <span>He leído la <a href="#" style={{ color: "var(--escape-red)" }}>política de privacidad</a> y acepto que me llaméis solo para resolver mi duda.</span>
          </label>
          <button type="submit" disabled={status.state === "sending"} className="escape-btn"
            style={{ background: status.state === "sending" ? "var(--escape-mute)" : "var(--escape-ink)", color: "#fff", border: 0, padding: "16px 24px", borderRadius: 999, fontWeight: 700, fontSize: 15, marginTop: 8, cursor: status.state === "sending" ? "not-allowed" : "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            {status.state === "sending" ? "Enviando…" : <>Enviar <span className="escape-btn-arrow">→</span></>}
          </button>
          {status.msg && (
            <div role="status" aria-live="polite"
              style={{ fontSize: 13, lineHeight: 1.5, padding: "10px 14px", borderRadius: 10, background: status.state === "error" ? "rgba(200,16,46,0.08)" : status.state === "success" ? "rgba(16,160,80,0.10)" : "var(--escape-paper-2)", color: status.state === "error" ? "var(--escape-red-deep)" : "var(--escape-ink)", border: "1px solid " + (status.state === "error" ? "rgba(200,16,46,0.25)" : "var(--escape-line)") }}>
              {status.msg}
            </div>
          )}
          <p style={{ fontSize: 12, color: "var(--escape-mute)", lineHeight: 1.4 }}>
            ¿Prefieres hablar ya? <a href={WHATSAPP_URL} target="_blank" rel="noopener" style={{ color: "var(--escape-red)", fontWeight: 600 }}>Escríbenos por WhatsApp →</a>
          </p>
        </form>
      );
    }

    function ContactoPage() {
      const reveal1 = useReveal();
      const reveal2 = useReveal();
      return (
        <div className="escape-root" style={{ background: "var(--escape-paper)", color: "var(--escape-ink)", width: "100%", overflow: "hidden" }}>
          <CNav />
          <section ref={reveal1} className="escape-reveal" style={{ padding: "80px 56px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 64 }} data-c="contactoFormGrid">
            <div>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, letterSpacing: "0.15em", color: "var(--escape-red)", marginBottom: 16 }}>● HABLEMOS</div>
              <h1 style={{ fontFamily: "var(--font-display)", fontSize: 120, lineHeight: 0.92, letterSpacing: "-0.045em" }} data-c="contactoFormTitle">
                Pásate o<br/><span className="escape-italic" style={{ color: "var(--escape-red)" }}>escríbenos.</span>
              </h1>
              <p style={{ fontSize: 19, lineHeight: 1.5, color: "var(--escape-ink-2)", marginTop: 24, maxWidth: 520 }}>
                Te resolvemos dudas, te enseñamos el local y te explicamos lo que mejor te encaja. Sin compromiso, sin venderte nada raro.
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginTop: 48, paddingTop: 32, borderTop: "1px solid var(--escape-line)" }} data-c="contacto-info">
                <InfoBlock label="DIRECCIÓN">
                  <a href={MAPS_URL} target="_blank" rel="noopener" style={{ textDecoration: "none", color: "inherit" }}>
                    <strong>Carrer Jaime Gómez Orts, 18</strong><br/>03202 Elx · Alicante
                  </a>
                </InfoBlock>
                <InfoBlock label="TELÉFONO / WHATSAPP">
                  <a href={PHONE_TEL} style={{ textDecoration: "none", color: "inherit" }}><strong>{PHONE_DISPLAY}</strong></a>
                </InfoBlock>
                <InfoBlock label="HORARIO">
                  <div>L–V · 10:00–14:00 / 16:00–20:30</div>
                  <div style={{ fontSize: 13, opacity: 0.7 }}>Fines de semana atendemos por WhatsApp</div>
                </InfoBlock>
                <InfoBlock label="REDES">
                  <a href="https://instagram.com/escapeautoescuelas" target="_blank" rel="noopener" style={{ textDecoration: "none", color: "inherit", display: "flex", alignItems: "center", gap: 10 }}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ color: "var(--escape-red)" }}>
                      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <div>
                      <strong>@escapeautoescuelas</strong><br/>
                      <span style={{ fontSize: 13, opacity: 0.7 }}>en Instagram</span>
                    </div>
                  </a>
                </InfoBlock>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 32 }}>
                <a href={WHATSAPP_URL} target="_blank" rel="noopener" className="escape-btn escape-btn-pulse"
                  style={{ background: "var(--escape-red)", color: "#fff", padding: "16px 24px", borderRadius: 999, fontWeight: 700, fontSize: 15, textDecoration: "none", display: "inline-block" }}>WhatsApp ahora</a>
                <a href={PHONE_TEL} className="escape-btn"
                  style={{ background: "transparent", color: "var(--escape-ink)", border: "1.5px solid var(--escape-ink)", padding: "16px 24px", borderRadius: 999, fontWeight: 600, fontSize: 15, textDecoration: "none", display: "inline-block" }}>
                  Llamar {PHONE_DISPLAY}
                </a>
              </div>
            </div>
            <ContactForm />
          </section>
          <section ref={reveal2} className="escape-reveal" style={{ padding: "0 56px 80px" }}>
            <a href={MAPS_URL} target="_blank" rel="noopener" className="escape-map-wrap"
              style={{ display: "block", position: "relative", aspectRatio: "16/6", borderRadius: 28, overflow: "hidden", background: "var(--escape-ink)", textDecoration: "none" }}>
              <iframe title="Ubicación Escape Autoescuelas" src={MAPS_EMBED}
                style={{ width: "100%", height: "100%", border: 0, position: "absolute", inset: 0, pointerEvents: "none" }}
                loading="lazy" referrerPolicy="no-referrer-when-downgrade" />
              <div style={{ position: "absolute", left: 32, bottom: 32, background: "rgba(10,10,10,0.92)", padding: "16px 20px", borderRadius: 12, color: "#fff", display: "flex", alignItems: "center", gap: 16 }}>
                <div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "rgba(255,255,255,0.7)" }}>VER EN GOOGLE MAPS</div>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 22, marginTop: 4 }}>Escape Autoescuelas</div>
                  <div style={{ fontSize: 13, marginTop: 4, opacity: 0.85 }}>Carrer Jaime Gómez Orts, 18 · 03202 Elx</div>
                </div>
                <div style={{ fontFamily: "var(--font-display)", fontSize: 28, color: "var(--escape-red)", marginLeft: 12 }}>→</div>
              </div>
            </a>
          </section>
          <CContactoDetail />
          <CEquipo />
          <CFooter />
        </div>
      );
    }

    function CEquipo() {
      const team = [
        { n: "Aitor Sánchez", r: "Profesor · Coche y Moto" },
        { n: "Juan de Dios Sánchez", r: "Profesor · Coche y Moto" },
      ];
      return (
        <section style={{ padding: "80px 56px", background: "#fff" }} id="equipo">
          <div style={{ marginBottom: 48 }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, letterSpacing: "0.15em", color: "var(--escape-red)", marginBottom: 16 }}>● EL EQUIPO</div>
            <h2 style={{ fontFamily: "var(--font-display)", fontSize: 64, lineHeight: 1, letterSpacing: "-0.03em" }}>Personas, <span className="escape-italic" style={{ color: "var(--escape-red)" }}>no máquinas.</span></h2>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 24 }}>
            {team.map((m, i) => (
              <article key={i} style={{ border: "1px solid var(--escape-line)", borderRadius: 14, overflow: "hidden" }}>
                <div style={{ aspectRatio: "4/5", background: "var(--escape-paper-2)" }}>
                  <img src={`assets/${m.n.split(" ")[0].toLowerCase()}.jpg`} alt={m.n} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                </div>
                <div style={{ padding: 24 }}>
                  <h3 style={{ fontFamily: "var(--font-display)", fontSize: 24, marginBottom: 4 }}>{m.n}</h3>
                  <p style={{ fontSize: 14, color: "var(--escape-ink-2)" }}>{m.r}</p>
                </div>
              </article>
            ))}
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ContactoPage />);
  </script>

  <script>
    (() => {
      let pending = null;
      document.addEventListener("pointermove", (e) => {
        if (pending) return;
        pending = e;
        requestAnimationFrame(() => {
          const ev = pending; pending = null;
          const el = ev.target && ev.target.closest && ev.target.closest(".escape-card, .escape-perm-card");
          if (!el) return;
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", (ev.clientX - r.left) + "px");
          el.style.setProperty("--my", (ev.clientY - r.top) + "px");
        });
      }, { passive: true });
    })();
  </script>
  <script src="cookies-banner.js"></script>
</body>
</html>
