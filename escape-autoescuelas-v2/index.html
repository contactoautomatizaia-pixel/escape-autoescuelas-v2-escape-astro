    function useReveal(once = true) {
      const ref = useRef(null);

        const el = ref.current;
        if (!el || typeof IntersectionObserver === "undefined") return;
        const io = new IntersectionObserver(
          (entries) => entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("is-visible");
              if (once) io.unobserve(e.target);
            }
          }),
          { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
        );
        io.observe(el);
        return () => io.disconnect();
      }, [once]);
      return ref;
    }

    /* ----- CARRUSEL DE FOTOS (auto-advance cada 3s, hover pausa) ----- */
    function CCarrusel() {
      const [idx, setIdx] = useState(0);
      const [paused, setPaused] = useState(false);
      const slides = [
        { src: "assets/local.jpg",    alt: "Fachada del local en Carrer Jaime Gómez Orts 18, Elx", label: "FACHADA" },
        { src: "assets/entrada.jpg",  alt: "Entrada y recepción de Escape Autoescuelas",           label: "RECEPCIÓN" },
        { src: "assets/despacho.jpg", alt: "Oficina y zona de matrícula",                          label: "OFICINA" },
        { ph: "FLOTA · COCHES",       label: "FLOTA · COCHES" },
        { ph: "FLOTA · MOTOS",        label: "FLOTA · MOTOS" },
        { ph: "CIRCUITO CERRADO",     label: "CIRCUITO" },
      ];
      const headRef = useReveal();

      useEffect(() => {
        if (paused) return;
        const t = setInterval(() => setIdx((i) => (i + 1) % slides.length), 3000);
        return () => clearInterval(t);
      }, [paused, slides.length]);

      const go = (i) => setIdx(((i % slides.length) + slides.length) % slides.length);

      return (
        <section style={cStyles.section} data-c="section">
          <div ref={headRef} className="escape-reveal" style={cStyles.sectionHead}>
            <div style={cStyles.eyebrow}>● EL LOCAL</div>
            <h2 style={cStyles.sectionTitle} data-c="section-title">
              Conoce <span className="escape-italic" style={{ color: "var(--escape-red)" }}>nuestro espacio.</span>
            </h2>
          </div>

          <div className="carrusel" onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
            <div className="carrusel-window">
              <div className="carrusel-track" style={{ transform: `translateX(-${idx * 100}%)` }}>
                {slides.map((s, i) => (
                  <div key={i} className="carrusel-slide">
                    {s.src ? (
                      <img src={s.src} alt={s.alt} loading="lazy" />
                    ) : (
                      <div className="escape-placeholder" style={{ width: "100%", height: "100%", fontSize: 14 }}>{s.ph}</div>
                    )}
                    <div style={{ position: "absolute", left: 16, bottom: 16, background: "rgba(10,10,10,0.85)", backdropFilter: "blur(4px)", color: "#fff", padding: "8px 12px", borderRadius: 10, fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.1em" }}>
                      {s.label}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <button className="carrusel-btn carrusel-btn-prev" onClick={() => go(idx - 1)} aria-label="Anterior">‹</button>
            <button className="carrusel-btn carrusel-btn-next" onClick={() => go(idx + 1)} aria-label="Siguiente">›</button>
            <div className="carrusel-dots" role="tablist">
              {slides.map((_, i) => (
                <button key={i} className={`carrusel-dot ${i === idx ? "is-active" : ""}`} onClick={() => go(i)} aria-label={`Ir a la imagen ${i + 1}`} />
              ))}
            </div>
          </div>
        </section>
      );
    }

  <!-- Mouse-tracking spotlight (sigue al cursor sobre cualquier card) -->
  <script>
    (() => {
      let pending = null;
      document.addEventListener("pointermove", (e) => {
        if (pending) return;
        pending = e;
        requestAnimationFrame(() => {
          const ev = pending; pending = null;
          const el = ev.target && ev.target.closest && ev.target.closest(".escape-card, .escape-perm-card");
          if (!el) return;
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", (ev.clientX - r.left) + "px");
          el.style.setProperty("--my", (ev.clientY - r.top) + "px");
        });
      }, { passive: true });
    })();
  </script>

  <!-- ============================================================
       FADE-IN ON SCROLL — IntersectionObserver global
       Pon class="fade-in" o class="reveal" a cualquier elemento
       y se mostrará suavemente al entrar al viewport.
       ============================================================ -->
  <script>
    (() => {
      if (typeof IntersectionObserver === "undefined") {
        document.querySelectorAll(".fade-in, .reveal").forEach((el) => el.classList.add("is-visible"));
        return;
      }
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -60px 0px" });

      const watchAll = () => {
        document.querySelectorAll(".fade-in:not(.is-visible), .reveal:not(.is-visible)")
                .forEach((el) => obs.observe(el));
      };
      watchAll();
      // Re-observa cuando React monta nuevo contenido
      new MutationObserver(watchAll).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
